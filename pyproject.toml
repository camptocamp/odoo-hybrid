[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-hybrid"
version = "0.0.0"
description = "Alternative Odoo server runner with multithreaded workers"
readme = "README.md"
requires-python = ">=3.10"
# Odoo is not declared as a dependency; it must be present in the environment separately.

[project.scripts]
odoo-hybrid = "odoo_hybrid.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_hybrid"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
